name: Marvin CI
on:
  push:
    branches: [marvin]
  pull_request:
    branches: [marvin]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: oven-sh/setup-bun@v2
      - run: python3 build.py --check-all
      - run: uvx ruff@0.17.0 check .
      - run: uv run --with-requirements requirements-dev.txt pytest -q
      - run: uv run --with-requirements requirements-dev.txt python scripts/check_artifacts_load.py
  browser:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1', '2', '3', '4']
    env:
      E2E_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/stack
        with:
          owui_image: ghcr.io/open-webui/open-webui:v0.12.5-slim@sha256:9a4db3e6c8d6174d4ed8952304115e90dcc36e9a8b98c2f8984eab321f29505e
          openclaw_version: '2026.10.9'
          log_dir: ${{ runner.temp }}/logs
      - run: uv run --with-requirements requirements-browser.txt python -m playwright install --with-deps chromium
      # Only fresh-stack flows. No test stops or restarts any service/container.
      - run: uv run --with-requirements requirements-dev.txt --with-requirements requirements-browser.txt pytest -x -q --junitxml="${{ runner.temp }}/logs/pytest.xml" e2e/test_e2e.py e2e/test_browser_flows.py -k 'not test_a_message_sent_while_the_gateway_restarts_gets_its_reply and not test_a_guest_run_continued_after_a_gateway_crash_stays_without_owner_rights and not test_a_handed_over_reply_reads_not_done_in_the_db_once_its_request_ended and not test_a_reply_whose_run_ends_while_owui_is_stopped_is_completed_on_start and not test_a_message_sent_while_the_pipe_waits_to_reconnect_gets_its_reply'
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marvin-browser-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/logs
